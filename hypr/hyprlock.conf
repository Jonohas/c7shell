#
# ---- HYPRLOCK ----
#
# Tokens mirror quickshell/c7shell/Theme/Theme.qml so the lock screen reads as
# the same desktop: crimson #e53a44 accent, #f0eff1 ink, oled ground, mono for
# everything the shell sets in mono and Space Grotesk for the display clock.
#
# This file existing is not cosmetic. hyprlock does NOT fall back to
# /usr/share/hypr/hyprlock.conf -- with no config it exits at startup with
# "Could not find config", which silently turns super+l, the power dropdown's
# lock row and hypridle's lock_cmd into no-ops.

$mono    = JetBrains Mono
$display = Space Grotesk

$ink     = rgba(f0eff1ff)
$ink2    = rgba(f0eff18c)   # Theme.text2, 0.55
$ink3    = rgba(f0eff166)   # Theme.text3, 0.40
$glass   = rgba(0f0f13cc)   # Theme.glassBase at glassAlphaPanel
$hair    = rgba(ffffff1a)   # Theme.hairlineStrong, lifted for a 1px outline
$accent  = rgba(e53a44ff)
$success = rgba(4ade80ff)

general {
    hide_cursor = true
    # No grace period is configured because v0.9.6 has no general:grace -- it is
    # the --grace flag only, and its default of 0 is what is wanted anyway.
    # A bare Enter is a stray keypress, not a failed attempt worth counting.
    ignore_empty_input = true
}

# uncomment to enable fingerprint authentication (fprintd is installed; this
# stays off until a finger is actually enrolled, or every lock opens with a
# prompt for a reader that will never answer)
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = scan fingerprint
#         present_message = scanning...
#     }
# }

animations {
    enabled = true
    bezier = c7, 0.2, 0, 0, 1
    animation = fadeIn, 1, 4, c7
    animation = fadeOut, 1, 4, c7
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # The desktop itself, blurred past legibility and dimmed. A screenshot has
    # nothing to keep in sync -- a hardcoded path would go stale the first time
    # the wallpaper is changed from the settings app.
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.32
    contrast = 0.95
    vibrancy = 0.15
    vibrancy_darkness = 0.15
}

# TIME
label {
    monitor =
    text = $TIME
    font_family = $display
    font_size = 96
    color = $ink

    position = 0, 190
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%a %b %-d" | tr 'A-Z' 'a-z'
    font_family = $mono
    font_size = 14
    color = $ink3

    position = 0, 122
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    rounding = 13
    outline_thickness = 1

    inner_color = $glass
    outer_color = $hair
    check_color = $success
    fail_color  = $accent
    font_color  = $ink

    font_family = $mono
    placeholder_text = <span foreground="##f0eff166">password</span>
    fail_text = $PAMFAIL · $ATTEMPTS
    check_text = authenticating...

    # Caps lock is the reason a correct password fails, and the sddm greeter
    # calls it out for the same reason (its card has a caps-lock line).
    capslock_color = rgba(e5717a99)

    dots_size = 0.28
    dots_spacing = 0.3
    fade_on_empty = false

    position = 0, 0
    halign = center
    valign = center
}

# WHO
label {
    monitor =
    text = $USER
    font_family = $mono
    font_size = 11
    color = $ink2

    position = 0, -46
    halign = center
    valign = center
}
