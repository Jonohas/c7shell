# The lock screen. Same language as the sddm greeter (§10 of the design canvas):
# near-black ground, one centered field, crimson accent, JetBrains Mono.
#
# This file is not optional. hyprlock refuses to start without a config --
# "Config path error: Could not find config" -- and it searches only
# XDG_CONFIG_HOME, HOME, XDG_CONFIG_DIRS and /etc/xdg, so the copy the hyprlock
# package leaves in /usr/share/hypr is never found. Without this file here,
# SUPER+L does nothing, the lock row in the power menu does nothing, and -- the
# part nobody notices -- hypridle's lock_cmd and before_sleep_cmd fail silently,
# so the machine idles and suspends unlocked.

general {
    hide_cursor = true
    ignore_empty_input = true
    # No grace period is configured on purpose: `grace` is a CLI flag in
    # hyprlock 0.9, not a config key, and its default is already 0 -- a lock
    # that a mouse nudge dismisses is not one, and hypridle locks before sleep,
    # which has to hold on resume.
}

auth {
    fingerprint {
        # Harmless when no fprintd device is present: hyprlock just offers the
        # password. The greeter makes the same call.
        enabled = true
    }
}

# The desktop, blurred: in-session the shell's surfaces are glass over your own
# windows, and the lock screen is the last of those surfaces. The greeter uses a
# flat backdrop instead because at boot there is nothing behind it to blur.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.35
}

# Sits on the ground colour, so a machine whose screenshot fails still comes up
# near-black rather than transparent.
background {
    monitor =
    color = rgba(08080aa8)
}

# 08:41 -- Theme.fs(30) at the greeter's scale, weight 300 is not expressible
# here, so the thinnest JetBrains Mono face fontconfig will resolve.
label {
    monitor =
    text = $TIME
    color = rgba(f0eff1cc)
    font_size = 64
    font_family = JetBrains Mono Light
    position = 0, 220
    halign = center
    valign = center
}

# thu 27 aug 2026
label {
    monitor =
    # No $DATE in hyprlock 0.9, and the greeter's line is lower case.
    text = cmd[update:60000] date +"%a %-d %b %Y" | tr 'A-Z' 'a-z'
    color = rgba(f0eff14d)
    font_size = 15
    font_family = JetBrains Mono
    position = 0, 172
    halign = center
    valign = center
}

# The avatar's crimson disc is not drawable here (hyprlock has no shapes), so the
# user line carries the identity instead, as the card's name does.
label {
    monitor =
    text = $USER
    color = rgba(f0eff1ff)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 96
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    color = rgba(f0eff157)
    font_size = 13
    font_family = JetBrains Mono
    position = 0, 68
    halign = center
    valign = center
}

# The card's field: 44px tall at the mockup's scale, 1.2x for a real panel.
input-field {
    monitor =
    size = 470, 53
    rounding = 16
    outline_thickness = 1
    outer_color = rgba(ffffff1a)
    inner_color = rgba(ffffff0d)
    font_color = rgba(f0eff1ff)
    font_family = JetBrains Mono

    # Round dots at 70% ink, centered -- the greeter draws its own for exactly
    # this look, because a TextInput would echo a platform bullet instead.
    dots_size = 0.22
    dots_spacing = 0.42
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span foreground="##f0eff147">password</span>
    fade_on_empty = false
    hide_input = false

    # Crimson while checking, crimson while wrong: the accent means "this is the
    # thing that matters", the same as the field's focus ring in the greeter.
    check_color = rgba(e53a4480)
    fail_color = rgba(e53a44a6)
    # $PAMFAIL is the reason pam gave, $FPRINTFAIL the fingerprint one; the
    # attempt count matches the greeter's "n of 3".
    fail_text = <span foreground="##e5717a">$PAMFAIL$FPRINTFAIL · $ATTEMPTS</span>
    check_text = <span foreground="##e5717a">checking…</span>
    capslock_color = rgba(e5717a99)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false

    position = 0, -8
    halign = center
    valign = center
}

# hostname · kernel · session, the greeter's top-left line, bottom-left here so
# it stays clear of the field.
label {
    monitor =
    text = cmd[update:0] printf '%s · %s' "$(hostname)" "$(uname -r)"
    color = rgba(f0eff147)
    font_size = 12
    font_family = JetBrains Mono
    position = 32, 26
    halign = left
    valign = bottom
}

label {
    monitor =
    text = enter unlocks · esc clears
    color = rgba(f0eff133)
    font_size = 12
    font_family = JetBrains Mono
    position = -32, 26
    halign = right
    valign = bottom
}
