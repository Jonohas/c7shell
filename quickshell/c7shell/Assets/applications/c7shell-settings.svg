<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- c7shell settings app icon. Self-coloured on purpose: unlike the glyphs in
       Assets/icons (painted #ffffff and colourised by MultiEffect at runtime),
       this one is handed to foreign launchers, taskbars and app grids, so it
       carries its own tile, its own hairline and the crimson accent literally.
       Colours are Theme's defaults frozen (canvas #131215, hairline #f0eff1 at
       10%, accent #e53a44); an icon file cannot follow a live accent.

       Two sliders, not three, and not a gear: at 16px a gear turns to mush and
       the third slider closes the gaps until the knobs merge with the tracks.
       Checked by rasterising at 16/22/32/64 before picking this geometry.

       No double hyphen anywhere in this comment: XML forbids it, and rsvg and
       Qt both refuse the whole file over one, which reads as a blank icon
       rather than as an error. -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#131215"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="none" stroke="#f0eff1" stroke-opacity="0.10" stroke-width="2"/>
  <g stroke="#f0eff1" stroke-opacity="0.38" stroke-width="4.5" stroke-linecap="round">
    <line x1="16" y1="24" x2="48" y2="24"/>
    <line x1="16" y1="41" x2="48" y2="41"/>
  </g>
  <g fill="#e53a44">
    <circle cx="39" cy="24" r="7.5"/>
    <circle cx="25" cy="41" r="7.5"/>
  </g>
</svg>
