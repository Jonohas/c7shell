# Which backend answers each portal interface in a c7shell (Hyprland) session.
# xdg-desktop-portal takes the first hyprland-portals.conf it finds and reads
# only that one -- this user copy replaces the stock file under
# /usr/share/xdg-desktop-portal entirely, so the default line travels with it.
[preferred]
# hyprland implements ScreenCast/Screenshot/GlobalShortcuts; gtk answers the
# rest, notably Settings, which is where apps read the dark-mode preference.
default=hyprland;gtk
# Without this line the gtk fallback answers FileChooser too, handing every
# portal-using app a GTK picker that looks nothing like dolphin (SUPER+E). The
# kde backend is the KDE file dialog: same KIO places sidebar and kdeglobals
# palette as dolphin. If xdg-desktop-portal-kde is not installed the portal
# falls back to gtk on its own -- nothing breaks, the picker just mismatches.
org.freedesktop.impl.portal.FileChooser=kde
